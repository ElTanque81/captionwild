<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2e24"/><stop offset="1" stop-color="#06140f"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4f6d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd38a"/><stop offset="1" stop-color="#b6f36a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- speech bubble -->
  <path d="M250 300 h420 a90 90 0 0 1 90 90 v220 a90 90 0 0 1 -90 90 h-250 l-120 100 v-100 h-50 a90 90 0 0 1 -90 -90 v-220 a90 90 0 0 1 90 -90 z" fill="url(#bub)"/>
  <!-- caption lines -->
  <rect x="270" y="410" width="300" height="38" rx="19" fill="#fff" opacity="0.95"/>
  <rect x="270" y="480" width="380" height="38" rx="19" fill="#fff" opacity="0.8"/>
  <rect x="270" y="550" width="220" height="38" rx="19" fill="#fff" opacity="0.65"/>
  <!-- wild leaf breaking out of the bubble -->
  <path d="M690 360 C 700 220, 800 160, 880 150 C 880 250, 820 340, 690 360 Z" fill="url(#leaf)"/>
  <path d="M700 352 C 760 290, 810 230, 860 170" stroke="#0f2e24" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M800 560 l18 44 44 18 -44 18 -18 44 -18 -44 -44 -18 44 -18 z" fill="#b6f36a"/>
</svg>
